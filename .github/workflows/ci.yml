name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev cmake nasm g++ pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.0.0
      - run: flutter_rust_bridge_codegen generate
        working-directory: apps/xmp-flutter
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0
      - run: flutter pub get
        working-directory: apps/xmp-flutter
      - run: flutter_rust_bridge_codegen generate
        working-directory: apps/xmp-flutter
      - run: flutter analyze
        working-directory: apps/xmp-flutter
      - run: flutter test
        working-directory: apps/xmp-flutter
