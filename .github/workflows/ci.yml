name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev cmake nasm g++ pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/xmp-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/xmp-app/package-lock.json
      - run: npm ci
      - run: npm run build

  app-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libxdo-dev libdbus-1-dev \
            libopus-dev cmake nasm g++ pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/xmp-app/src-tauri -> target
      - run: npm ci && npm run build
        working-directory: apps/xmp-app
      - run: cargo test --lib --locked
        working-directory: apps/xmp-app/src-tauri
