name: Release

# Push a tag like v0.2.0 to build and publish server binaries,
# desktop installers and an Android APK.
# Run manually (workflow_dispatch) to build everything without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "28.2.13676358"

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopus-dev \
            libdbus-1-dev \
            cmake \
            nasm \
            g++ \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install cargo-expand
        run: cargo install cargo-expand --locked

      - name: Install Flutter dependencies
        working-directory: apps/xmp-flutter
        run: flutter pub get

      - name: Generate Rust-Dart bridge
        working-directory: apps/xmp-flutter
        run: flutter_rust_bridge_codegen generate

      - name: Run Rust tests
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.rel.outputs.release_id }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that file versions match the tag (warning only)
        if: steps.v.outputs.publish == 'true'
        env:
          TAG_VERSION: ${{ steps.v.outputs.version }}
        run: |
          app=$(grep '^version: ' apps/xmp-flutter/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          srv=$(grep -m1 'version = ' Cargo.toml | sed -E 's/.*version = "([^"]+)".*/\1/')
          [[ "$app" == "$TAG_VERSION" ]] || echo "::warning file=apps/xmp-flutter/pubspec.yaml::Tag is v$TAG_VERSION but the app version is $app. Bump it before tagging."
          [[ "$srv" == "$TAG_VERSION" ]] || echo "::warning file=Cargo.toml::Tag is v$TAG_VERSION but the server version is $srv. Bump [workspace.package] before tagging."

      - name: Create draft release
        id: rel
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "XMP ${GITHUB_REF_NAME}" --generate-notes
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -n1)
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  server:
    name: Server (${{ matrix.name }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-aarch64,  os: macos-14,         target: aarch64-apple-darwin }
          - { name: macos-x86_64,   os: macos-14,         target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM (Windows, for ring)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress && echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p xmp-server --target ${{ matrix.target }}

      - name: Package
        id: pkg
        run: |
          name="xmp-server-${{ needs.prepare.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          ext=""
          [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/xmp-server${ext}" "dist/$name/"
          cp README.md "dist/$name/"
          cp -r docs "dist/$name/docs" 2>/dev/null || true
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: ${{ steps.pkg.outputs.file }}

      - name: Upload to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.file }}" --clobber

  # ---------------------------------------------------------------------------
  flutter-client:
    name: Flutter (${{ matrix.target }})
    needs: [test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest,  name: android }
          - { target: macos,   os: macos-14,       name: macos-arm64 }
          - { target: macos,   os: macos-13,       name: macos-x86_64 }
          - { target: windows, os: windows-latest, name: windows-x86_64 }
          - { target: linux,   os: ubuntu-latest,  name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libopus-dev \
            libdbus-1-dev \
            nasm \
            g++

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK and NDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.target == 'android'
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root was not set by setup-android" >&2
            exit 1
          fi
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android signing
        if: matrix.target == 'android'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "Android signing secrets are not configured; using the debug key."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install cargo-expand
        run: cargo install cargo-expand --locked

      - name: Install Flutter dependencies
        working-directory: apps/xmp-flutter
        run: flutter pub get

      - name: Generate Rust-Dart bridge
        working-directory: apps/xmp-flutter
        run: flutter_rust_bridge_codegen generate

      - name: Build Flutter app
        working-directory: apps/xmp-flutter
        run: |
          if [[ "${{ matrix.target }}" == "android" ]]; then
            flutter build apk --release --split-per-abi
          else
            flutter build ${{ matrix.target }} --release
          fi

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          cd apps/xmp-flutter/build/windows/x64/runner/Release
          7z a ../../../../../../../XMP-windows.zip *

      - name: Package Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          cd apps/xmp-flutter/build/linux/x64/release/bundle
          tar -czf ../../../../../../../XMP-linux.tar.gz *

      - name: Package macOS
        if: matrix.target == 'macos'
        shell: bash
        run: |
          cd apps/xmp-flutter/build/macos/Build/Products/Release
          zip -r ../../../../../../../XMP-macos.zip xmp_flutter.app

      - name: Prepare artifact
        id: pkg
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "android" ]]; then
            mkdir -p XMP-android
            cp apps/xmp-flutter/build/app/outputs/flutter-apk/app-*-release.apk XMP-android/
            (cd XMP-android && sha256sum *.apk > SHA256SUMS.txt)
            zip -r XMP-android-${{ needs.prepare.outputs.version }}.zip XMP-android >/dev/null
            echo "file=XMP-android-${{ needs.prepare.outputs.version }}.zip" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.target }}" == "windows" ]]; then
          echo "file=XMP-windows.zip" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.target }}" == "linux" ]]; then
            echo "file=XMP-linux.tar.gz" >> "$GITHUB_OUTPUT"
          elif [[ "${{ matrix.target }}" == "macos" ]]; then
          mv XMP-macos.zip XMP-macos-${{ matrix.name }}.zip
          echo "file=XMP-macos-${{ matrix.name }}.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}

      - name: Upload to draft release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.file }}" --clobber

  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [prepare, test, server, flutter-client]
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.test.result == 'success' && needs.server.result == 'success' && needs.flutter-client.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets and generate checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
