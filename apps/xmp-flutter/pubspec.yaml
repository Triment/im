name: xmp_flutter
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  file_picker: ^13.3.0
  intl: ^0.20.3
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  permission_handler: ^13.0.2
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  flutter_rust_bridge_hooks: 2.13.0
  shadcn_flutter: ^0.0.55

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.0
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E7C7B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true
