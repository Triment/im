[package]
name = "xmp-app"
version = "0.1.0"
edition = "2021"
description = "XMP cross-platform client (Tauri 2)"

[workspace]

[lib]
name = "xmp_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
xmp-client = { path = "../../../crates/client" }
xmp-codec = { path = "../../../crates/codec" }
xmp-proto = { path = "../../../crates/proto" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

# OS keychain (Windows Credential Manager / macOS Keychain / Secret Service). Not available on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
